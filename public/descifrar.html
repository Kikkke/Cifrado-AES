<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descifrar Archivo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container-fluid dark-bg">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-8">
                <h1 class="title text-center">Descifrar Archivo</h1>
                <form id="formDescifrado" class="p-4 bg-dark rounded-4 shadow-lg" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="archivo" class="form-label text-white">Selecciona archivo cifrado:</label>
                        <input type="file" class="form-control" id="archivo">
                    </div>
                    <div class="mb-4">
                        <label for="claveDescifrar" class="form-label text-white">Clave de descifrado:</label>
                        <input type="password" class="form-control" id="claveDescifrar">
                    </div>
                    <div class="mb-4">
                        <label for="resultado" class="form-label text-white">Mensaje descifrado:</label>
                        <textarea class="form-control" id="resultado" rows="5" readonly></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-red btn-custom">Descifrar</button>
                        <a href="/" class="btn btn-dark-red btn-custom ms-3">Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="descifrar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
