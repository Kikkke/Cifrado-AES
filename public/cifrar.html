<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrar Mensaje</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container-fluid dark-bg">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-8">
                <h1 class="title text-center">Cifrar Mensaje</h1>
                <form id="formCifrado" class="p-4 bg-dark rounded-4 shadow-lg">
                    <div class="mb-4">
                        <label for="mensaje" class="form-label text-white">Mensaje a cifrar:</label>
                        <textarea class="form-control" id="mensaje" rows="5"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="clave" class="form-label text-white">Clave de cifrado:</label>
                        <input type="password" class="form-control" id="clave">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-red btn-custom">Cifrar y Descargar</button>
                        <a href="/" class="btn btn-dark-red btn-custom ms-3">Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cifrar.js"></script>
</body>
</html>
